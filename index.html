<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#17120d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/tales-of-leighneron-32.png" />
    <link rel="apple-touch-icon" href="icons/tales-of-leighneron-192.png" />
    <link rel="preload" as="image" href="assets/reference/game-load.png" />
    <title>Tales of Leighneron</title>
    <style>
      /* This screen must work before the JavaScript/CSS bundles arrive. */
      #startup-splash { position:fixed; inset:0; z-index:10000; display:grid; place-items:center; margin:0; padding:24px; background:#000; opacity:1; transition:opacity 450ms ease-in-out; }
      #startup-splash img { display:block; width:min(76vw,68vh,520px); height:auto; max-height:100%; object-fit:contain; animation:startup-logo-in 650ms ease-out both; }
      #startup-splash .startup-rights { position:absolute; left:24px; right:24px; bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px)); margin:0; color:#a9a39a; font:12px/1.5 Georgia,serif; text-align:center; }
      #startup-splash.is-complete { opacity:0; }
      @keyframes startup-logo-in { from { opacity:0; } to { opacity:1; } }
      @media (prefers-reduced-motion:reduce) { #startup-splash { transition:none; } #startup-splash img { animation:none; } }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-label="Starting Tales of Leighneron">
      <img src="assets/reference/game-load.png" alt="ZUKI" fetchpriority="high" decoding="async" />
      <p class="startup-rights">All rights reserved 2026</p>
    </div>
    <div id="root"></div>
    <script>
      (()=>{
        const report=event=>{
          document.getElementById('startup-splash')?.remove();
          const root=document.getElementById('root');if(!root)return;
          root.replaceChildren();const box=document.createElement('section');box.style.cssText='padding:24px;color:#f4dfae;font-family:Georgia,serif';
          const text=document.createElement('p');text.textContent='Tales of Leighneron could not finish loading. Your save has not been deleted.';
          const cause=event instanceof CustomEvent?event.detail:undefined;
          const reason=typeof cause?.message==='string'?cause.message:typeof cause==='string'?cause:'';
          box.append(text);
          const detail=document.createElement('p');detail.style.cssText='max-width:70ch;white-space:pre-wrap;overflow-wrap:anywhere';
          detail.textContent=reason?'Startup error: '+reason:'Required application code could not be loaded. Reconnect to the app’s host and retry.';
          box.append(detail);
          const retry=document.createElement('button');retry.textContent='Retry opening';retry.onclick=()=>location.reload();box.append(retry);root.append(box);
        };
        window.addEventListener('mernondna-startup-error',report);
        window.addEventListener('error',event=>{if(event.target instanceof HTMLScriptElement)report();},true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
