name: Build and release 2.5D Windows EXE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-exe.yml'
      - 'desktop/**'
      - 'electron-builder.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-25d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-exe:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install existing game dependencies
        run: npm ci
      - name: Check TypeScript without starting the game
        run: |
          npm run test:types
          npm exec --no -- tsc -p tsconfig.node.json --noEmit
      - name: Bundle the complete offline game
        run: npm run build
      - name: Install pinned Windows desktop packaging tools
        run: npm install --no-save --package-lock=false electron@45.0.0 electron-builder@26.18.0
      - name: Package portable Windows executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win portable --x64 --publish never
      - name: Verify executable and record SHA256
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'windows-release/Tales-of-Leighneron-2.5D-Windows.exe'
          if (-not (Test-Path $exe)) { throw 'Windows EXE was not created.' }
          $file = Get-Item $exe
          if ($file.Length -lt 10000000) { throw 'Windows EXE looks incomplete.' }
          $stream = [System.IO.File]::OpenRead($exe)
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) {
              throw 'Windows EXE lacks the MZ header.'
            }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content "$exe.sha256" -Encoding ascii
          Write-Host "Portable Windows EXE: $($file.Length) bytes, SHA256 $hash"
      - name: Publish Windows portable EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-25d-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create $tag 'windows-release/Tales-of-Leighneron-2.5D-Windows.exe' 'windows-release/Tales-of-Leighneron-2.5D-Windows.exe.sha256' --target '${{ github.sha }}' --title "Tales of Leighneron 2.5D - Windows ($tag)" --notes "Portable Windows x64 EXE; no installer or internet required. Includes the offline 2.5D game assets. Desktop save data uses a persistent isolated Electron profile. This binary is NOT Authenticode-signed; Windows SmartScreen may ask for confirmation. Automated TypeScript/build/packaging checks passed, but Windows gameplay and GPU performance have not been tested."
