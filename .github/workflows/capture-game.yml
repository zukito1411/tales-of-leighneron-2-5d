name: Capture updated game
on:
  push:
    branches: ['capture/**']
    paths: ['.github/workflows/capture-game.yml','scripts/capture-reference-buildings.mjs']
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GAME_COMMIT: 5e960fbf0cf950f564214cead3966c7a0e680035
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Capture real game in a mobile browser viewport
        run: node scripts/capture-reference-buildings.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Leighneron-reference-building-captures
          path: game-captures/
          retention-days: 3
          if-no-files-found: warn
