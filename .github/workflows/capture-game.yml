name: Windmill and shrine real-game review
on:
  push:
    branches: ['capture/windmills-*']
    paths: ['.github/workflows/capture-game.yml','scripts/review-windmills-shrine.mjs','src/game/presentation25d/**','tests/windmillMotion.test.ts']
permissions:
  contents: read
concurrency:
  group: windmill-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GAME_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compiler and targeted motion checks
        run: |
          npm run test:types
          npm exec --no -- tsc -p tsconfig.node.json --noEmit
          npm exec --no -- vitest run tests/windmillMotion.test.ts
      - name: Inspect the previous real game with identical camera and viewport
        run: |
          BASELINE_ROOT="$RUNNER_TEMP/leighneron-windmill-baseline"
          git fetch --depth=1 origin fe28d9b7e557e51143225597cb1254333747b6b1
          git worktree add --detach "$BASELINE_ROOT" fe28d9b7e557e51143225597cb1254333747b6b1
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASELINE_ROOT/node_modules"
          GAME_COMMIT=fe28d9b7e557e51143225597cb1254333747b6b1 REVIEW_LABEL=baseline REVIEW_ROOT="$BASELINE_ROOT" node scripts/review-windmills-shrine.mjs
      - name: Run the updated game, capture materials and compare weather rotation
        run: REVIEW_LABEL=updated node scripts/review-windmills-shrine.mjs
      - name: Keep screenshots and runtime measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windmill-and-shrine-game-review
          path: test-results/windmill-review/
          retention-days: 7
          if-no-files-found: warn
