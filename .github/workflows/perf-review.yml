name: Performance-preserving rendering review

on:
  pull_request:
    paths:
      - 'src/game/presentation25d/**'
      - 'src/game/MernondnaGame.ts'
      - 'src/game/systems/framePacing.ts'
      - 'tests/framePacing.test.ts'
      - 'tests/frameWorkBudget.test.ts'
      - 'tests/browser/staticSubmissionReview.spec.ts'
      - '.github/workflows/perf-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install existing dependencies
        run: npm ci
      - name: Check TypeScript
        run: |
          npm run test:types
          npm exec --no -- tsc -p tsconfig.node.json --noEmit
      - name: Verify presented FPS readings and loop pacing
        run: npm test -- tests/frameTiming.test.ts tests/framePacing.test.ts tests/frameWorkBudget.test.ts
      - name: Prepare Chromium for actual renderer test
        run: npx playwright install --with-deps chromium
      - name: Confirm static instance parity, ordering and dormant reactivation
        run: npm run test:browser -- tests/browser/staticSubmissionReview.spec.ts --trace=off
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-rendering-failure
          path: |
            test-results/
            .asset-review/
          if-no-files-found: ignore
