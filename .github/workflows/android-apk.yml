name: Build and release 2.5D Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-25d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public fingerprint of the existing update-compatible secret-backed key.
      EXPECTED_ANDROID_CERT_SHA256: '8d4fa69a8a10b95605d173694278d84f97b6cf98a456564417ec61b552f5b2c7'
    steps:
      - name: Checkout separate 2.5D repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0'
      - run: npm ci
      - name: Check TypeScript without starting the game
        run: |
          npm run test:types
          npm exec --no -- tsc -p tsconfig.node.json --noEmit
      - name: Build web content and sync separate Android app
        run: npm run cap:android:refresh
      - name: Configure Android release APK signing
        env:
          ANDROID_25D_KEYSTORE_BASE64: ${{ secrets.ANDROID_25D_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_25D_STORE_PASSWORD: ${{ secrets.ANDROID_25D_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_25D_KEY_PASSWORD: ${{ secrets.ANDROID_25D_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_25D_KEY_ALIAS: ${{ secrets.ANDROID_25D_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.android"
          # A named repository secret is stable across runs. Never generate
          # an ephemeral keystore that changes the install/update signature.
          if [[ -n "${ANDROID_25D_KEYSTORE_BASE64:-}" ]]; then
            signing_bytes="$ANDROID_25D_KEYSTORE_BASE64"
            for name in ANDROID_25D_STORE_PASSWORD ANDROID_25D_KEY_PASSWORD ANDROID_25D_KEY_ALIAS; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Missing $name for the permanent release keystore."
                exit 1
              fi
            done
            echo "SIGNING_MODE=persistent-release-key" >> "$GITHUB_ENV"
          elif [[ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            # User-provided persistent debug keystore signs a non-debuggable
            # RELEASE artifact. These Android SDK defaults only apply to this
            # explicit debug-keystore secret and are overridable by secrets.
            signing_bytes="$ANDROID_DEBUG_KEYSTORE_BASE64"
            ANDROID_25D_STORE_PASSWORD="${ANDROID_25D_STORE_PASSWORD:-android}"
            ANDROID_25D_KEY_PASSWORD="${ANDROID_25D_KEY_PASSWORD:-android}"
            ANDROID_25D_KEY_ALIAS="${ANDROID_25D_KEY_ALIAS:-androiddebugkey}"
            echo "SIGNING_MODE=persistent-debug-key" >> "$GITHUB_ENV"
            echo "::warning::Using ANDROID_DEBUG_KEYSTORE_BASE64 for an assembleRelease APK. The APK is non-debuggable, but debug certificates are not suitable for Play Store production."
          else
            echo "::error::Missing signing keystore: provide ANDROID_25D_KEYSTORE_BASE64, ANDROID_KEYSTORE_BASE64, or ANDROID_DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$signing_bytes" | base64 --decode > "$HOME/.android/leighneron25d.keystore"
          keytool -list -keystore "$HOME/.android/leighneron25d.keystore" \
            -alias "$ANDROID_25D_KEY_ALIAS" -storepass "$ANDROID_25D_STORE_PASSWORD" >/dev/null
          chmod 600 "$HOME/.android/leighneron25d.keystore"
          echo "ANDROID_25D_KEYSTORE=$HOME/.android/leighneron25d.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$ANDROID_25D_STORE_PASSWORD"
          echo "::add-mask::$ANDROID_25D_KEY_PASSWORD"
          echo "ANDROID_25D_STORE_PASSWORD=$ANDROID_25D_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_25D_KEY_PASSWORD=$ANDROID_25D_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_25D_KEY_ALIAS=$ANDROID_25D_KEY_ALIAS" >> "$GITHUB_ENV"
          cat > android/app/ci-signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_25D_KEYSTORE'))
                      storePassword System.getenv('ANDROID_25D_STORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_25D_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_25D_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      debuggable false
                  }
              }
          }
          GRADLE
          printf '\napply from: "ci-signing.gradle"\n' >> android/app/build.gradle
      - name: Assemble non-debuggable 2.5D release APK
        working-directory: android
        run: bash gradlew :app:assembleRelease -PciVersionCode="$GITHUB_RUN_NUMBER" --no-daemon --console=plain
      - name: Verify signed APK and prepare release notes
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          [[ -s "$apk" ]] || { echo "::error::Missing release APK"; exit 1; }
          certificate_report="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$certificate_report"
          certificate_sha="$(printf '%s\n' "$certificate_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          if [[ -z "$certificate_sha" ]]; then
            echo "::error::APK signature certificate SHA-256 could not be verified."
            exit 1
          fi
          if [[ "${certificate_sha,,}" != "$EXPECTED_ANDROID_CERT_SHA256" ]]; then
            echo "::error::Signing identity changed. Preserve the existing ANDROID_DEBUG_KEYSTORE_BASE64 secret so installed games can update in place."
            exit 1
          fi
          metadata="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")"
          grep -q "^package: name='com.mernondna.rpg25d'" <<< "$metadata" || { echo "::error::Wrong Android package"; exit 1; }
          if grep -q '^application-debuggable' <<< "$metadata"; then echo "::error::APK still debuggable"; exit 1; fi
          cp "$apk" Tales-of-Leighneron-2.5D.apk
          sha256sum Tales-of-Leighneron-2.5D.apk > Tales-of-Leighneron-2.5D.apk.sha256
          cat > release-notes.md <<NOTES
          # Tales of Leighneron — Experimental 2.5D Android release

          Separate Android app: \`com.mernondna.rpg25d\`. The original game and installation are unaffected.
          Release-variant, non-debuggable, signed APK. This edition retains the original
          simulation, quests, combat, and save payload, with a Three.js projected world.
          House height and doors are sized against the standing player while
          retaining their original ground footprints, approaches and collision.
          Normal coastal boats now have closed plank hulls, decks, benches,
          masts and original painted sails; crew stand on the rotating deck.
          The Tower of Might follows the original rune-covered round tower
          artwork, and its standing interaction point is clear of collision.
          Interior wall panels now meet the full room/corridor floor perimeter,
          including south-facing edges, with solid corners, caps and the original
          wall art. The exit arch and shared corridor openings remain clear.
          Streaming, manual zoom, cutaways, saves and signing identity remain.

          **Signing mode: $SIGNING_MODE (stable GitHub Actions secret-backed keystore).**
          The APK is a non-debuggable release assembled by Gradle, not a debug variant. If signed using a debug certificate, it is intended for direct installation/testing rather than production app-store publication. Previous APKs signed with a different or ephemeral key cannot be updated in place; export saves before reinstalling.

          Signing certificate SHA-256: \`$certificate_sha\`. Compare this value with the next APK to confirm update-compatible signing.

          **Experimental**: This workflow verifies compilation, package ID, APK signing
          and the non-debuggable manifest. Real-device rendering, FPS and gameplay have
          **not** been visually verified. Back up saves before changing installations.
          NOTES
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-25d-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Tales-of-Leighneron-2.5D.apk Tales-of-Leighneron-2.5D.apk.sha256 \
            --target "$GITHUB_SHA" --title "2.5D experimental Android build ${GITHUB_SHA:0:7}" \
            --notes-file release-notes.md --latest
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Tales-of-Leighneron-2.5D.apk" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Tales-of-Leighneron-2.5D-Android-Release
          path: |
            Tales-of-Leighneron-2.5D.apk
            Tales-of-Leighneron-2.5D.apk.sha256
          if-no-files-found: error
          retention-days: 14
