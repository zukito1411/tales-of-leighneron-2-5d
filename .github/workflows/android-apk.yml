name: Build 2.5D Android preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-25d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0'
      - run: npm ci
      - name: Compile web game and sync the separate Android application
        run: npm run cap:android:refresh
      - name: Build experimental APK
        working-directory: android
        run: bash gradlew :app:assembleDebug -PciVersionCode="$GITHUB_RUN_NUMBER" --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Tales-of-Leighneron-2.5D-Android-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
