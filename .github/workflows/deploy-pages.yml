name: Build 2.5D browser game

on:
  push:
    branches: [main]
    # No browser rebuild for workflow-only maintenance.
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-25d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check application, test and configuration types
        run: |
          npm run test:types
          npm exec --no -- tsc -p tsconfig.node.json --noEmit
      - name: Build browser game
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Tales-of-Leighneron-2.5D-Web
          path: dist/
          if-no-files-found: error
          retention-days: 14
