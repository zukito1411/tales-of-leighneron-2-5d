name: Build and release 2.5D Android APK

on:
  push:
    branches: [main]
    # Workflow-only maintenance must not rebuild the APK.
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

# Only publish verified release APKs; cancel superseded Android builds.
concurrency:
  group: leighneron-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public fingerprint of the existing update-compatible secret-backed key.
      EXPECTED_ANDROID_CERT_SHA256: '8d4fa69a8a10b95605d173694278d84f97b6cf98a456564417ec61b552f5b2c7'
    steps:
      - name: Checkout separate 2.5D repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Reuse the official Gradle distribution on subsequent releases. A
      # transient upstream GitHub 504 must not block APK publication.
      - name: Restore Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-8.11.1-bin-v1
      - name: Prepare Gradle 8.11.1 with download retries
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Preparing Gradle 8.11.1 (attempt ${attempt}/5)"
            if bash gradlew --version; then
              exit 0
            fi
            if [[ "${attempt}" -eq 5 ]]; then
              echo "::error::Could not download the Gradle 8.11.1 distribution after five attempts."
              exit 1
            fi
            echo "::warning::Gradle download failed; retrying after a short backoff."
            sleep $((attempt * 12))
          done
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0'
      - run: npm ci
      - name: Check TypeScript without starting the game
        run: |
          npm run test:types
          npm exec --no -- tsc -p tsconfig.node.json --noEmit
      - name: Build web content and sync separate Android app
        run: |
          npm run build
          node scripts/prepare-android-downloads.mjs
          npx cap sync android
      - name: Upload immutable game download packs
        uses: actions/upload-artifact@v4
        with:
          name: Android-Game-Download-Packs
          path: asset-packs/*.zip
          compression-level: 0
          if-no-files-found: error
      - name: Configure Android release APK signing
        env:
          ANDROID_25D_KEYSTORE_BASE64: ${{ secrets.ANDROID_25D_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_25D_STORE_PASSWORD: ${{ secrets.ANDROID_25D_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_25D_KEY_PASSWORD: ${{ secrets.ANDROID_25D_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_25D_KEY_ALIAS: ${{ secrets.ANDROID_25D_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.android"
          # A named repository secret is stable across runs. Never generate
          # an ephemeral keystore that changes the install/update signature.
          if [[ -n "${ANDROID_25D_KEYSTORE_BASE64:-}" ]]; then
            signing_bytes="$ANDROID_25D_KEYSTORE_BASE64"
            for name in ANDROID_25D_STORE_PASSWORD ANDROID_25D_KEY_PASSWORD ANDROID_25D_KEY_ALIAS; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Missing $name for the permanent release keystore."
                exit 1
              fi
            done
            echo "SIGNING_MODE=persistent-release-key" >> "$GITHUB_ENV"
          elif [[ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            # User-provided persistent debug keystore signs a non-debuggable
            # RELEASE artifact. These Android SDK defaults only apply to this
            # explicit debug-keystore secret and are overridable by secrets.
            signing_bytes="$ANDROID_DEBUG_KEYSTORE_BASE64"
            ANDROID_25D_STORE_PASSWORD="${ANDROID_25D_STORE_PASSWORD:-android}"
            ANDROID_25D_KEY_PASSWORD="${ANDROID_25D_KEY_PASSWORD:-android}"
            ANDROID_25D_KEY_ALIAS="${ANDROID_25D_KEY_ALIAS:-androiddebugkey}"
            echo "SIGNING_MODE=persistent-debug-key" >> "$GITHUB_ENV"
            echo "::warning::Using ANDROID_DEBUG_KEYSTORE_BASE64 for an assembleRelease APK. The APK is non-debuggable, but debug certificates are not suitable for Play Store production."
          else
            echo "::error::Missing signing keystore: provide ANDROID_25D_KEYSTORE_BASE64, ANDROID_KEYSTORE_BASE64, or ANDROID_DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$signing_bytes" | base64 --decode > "$HOME/.android/leighneron25d.keystore"
          keytool -list -keystore "$HOME/.android/leighneron25d.keystore" \
            -alias "$ANDROID_25D_KEY_ALIAS" -storepass "$ANDROID_25D_STORE_PASSWORD" >/dev/null
          chmod 600 "$HOME/.android/leighneron25d.keystore"
          echo "ANDROID_25D_KEYSTORE=$HOME/.android/leighneron25d.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$ANDROID_25D_STORE_PASSWORD"
          echo "::add-mask::$ANDROID_25D_KEY_PASSWORD"
          echo "ANDROID_25D_STORE_PASSWORD=$ANDROID_25D_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_25D_KEY_PASSWORD=$ANDROID_25D_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_25D_KEY_ALIAS=$ANDROID_25D_KEY_ALIAS" >> "$GITHUB_ENV"
          cat > android/app/ci-signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_25D_KEYSTORE'))
                      storePassword System.getenv('ANDROID_25D_STORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_25D_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_25D_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      debuggable false
                  }
              }
          }
          GRADLE
          printf '\napply from: "ci-signing.gradle"\n' >> android/app/build.gradle
      - name: Assemble non-debuggable 2.5D release APK
        working-directory: android
        run: bash gradlew :app:assembleRelease -PciVersionCode="$GITHUB_RUN_NUMBER" --no-daemon --console=plain
      - name: Verify signed APK and prepare release notes
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          [[ -s "$apk" ]] || { echo "::error::Missing release APK"; exit 1; }
          certificate_report="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$certificate_report"
          certificate_sha="$(printf '%s\n' "$certificate_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          if [[ -z "$certificate_sha" ]]; then
            echo "::error::APK signature certificate SHA-256 could not be verified."
            exit 1
          fi
          if [[ "${certificate_sha,,}" != "$EXPECTED_ANDROID_CERT_SHA256" ]]; then
            echo "::error::Signing identity changed. Preserve the existing ANDROID_DEBUG_KEYSTORE_BASE64 secret so installed games can update in place."
            exit 1
          fi
          metadata="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")"
          grep -q "^package: name='com.mernondna.rpg25d'" <<< "$metadata" || { echo "::error::Wrong Android package"; exit 1; }
          if grep -q '^application-debuggable' <<< "$metadata"; then echo "::error::APK still debuggable"; exit 1; fi
          cp "$apk" Tales-of-Leighneron-2.5D.apk
          sha256sum Tales-of-Leighneron-2.5D.apk > Tales-of-Leighneron-2.5D.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Tales-of-Leighneron-2.5D-Android-Release
          path: |
            Tales-of-Leighneron-2.5D.apk
            Tales-of-Leighneron-2.5D.apk.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified Android APK release
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download verified Android APK and checksum
        uses: actions/download-artifact@v4
        with:
          name: Tales-of-Leighneron-2.5D-Android-Release
          path: release-assets
      - name: Download game asset packs
        uses: actions/download-artifact@v4
        with:
          name: Android-Game-Download-Packs
          path: asset-packs
      - name: Publish immutable asset storage before the small APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=leighneron-assets-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title 'Persistent game asset storage' --notes 'Immutable data packs for the Android downloader. Keep this release.' --prerelease --latest=false
          fi
          release_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.id')"
          gh api --paginate "repos/$GH_REPO/releases/$release_id/assets?per_page=100" --jq '.[] | select(.state == "uploaded") | .name' > existing-packs.txt
          for pack in asset-packs/*.zip; do
            filename="$(basename "$pack")"
            if ! grep -Fxq "$filename" existing-packs.txt; then gh release upload "$tag" "$pack" --clobber; fi
          done
      - name: Verify Android APK release payload
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          test -s Tales-of-Leighneron-2.5D.apk
          test -s Tales-of-Leighneron-2.5D.apk.sha256
          sha256sum --check Tales-of-Leighneron-2.5D.apk.sha256
      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="leighneron-25d-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<'NOTES'
          # Tales of Leighneron 2.5D — Android APK

          Non-debuggable, certificate-verified Android APK for
          com.mernondna.rpg25d. The signing fingerprint is checked against
          the existing install/update-compatible key.

          On first launch, the game downloads its immutable game-file packs.
          Completed packs are reused on updates and for offline play.
          First-launch downloads require internet access and adequate disk space.
          Retrying or restarting preserves verified completed files.

          This release does not include Windows EXE or installer builds.
          Game graphics, effects, combat, story, and save behavior are unchanged
          by the release-workflow removal of the Windows builder.

          Real-device FPS is not established by CI. Back up saves before
          installation changes.
          NOTES
          gh release create "$tag" \
            release-assets/Tales-of-Leighneron-2.5D.apk \
            release-assets/Tales-of-Leighneron-2.5D.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Tales of Leighneron 2.5D - Android APK ($tag)" \
            --notes-file release-notes.md \
            --latest
          {
            echo "### Android APK release published"
            echo "- Android APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Tales-of-Leighneron-2.5D.apk"
            echo "- Release page: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only the four newest published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Retain the existing rolling release policy; never delete the immutable asset-storage release.
          # Sort by actual publish time: API order is not always chronological.
          rows="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .tag_name != "leighneron-assets-v1") | [(.published_at // .created_at), .tag_name] | @tsv')"
          if [[ -z "$rows" ]]; then
            echo 'No published releases to prune.'
            exit 0
          fi
          mapfile -t tags < <(printf '%s\n' "$rows" | LC_ALL=C sort -r | cut -f2)
          echo "Published releases before cleanup: ${#tags[@]}"
          for ((index=4; index<${#tags[@]}; index++)); do
            tag="${tags[index]}"
            if [[ -z "$tag" ]]; then echo 'Empty tag, refusing cleanup'; exit 1; fi
            echo "Removing old release and tag: $tag"
            gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes
          done
          echo 'Finished: keep only the four most recently published releases.'
