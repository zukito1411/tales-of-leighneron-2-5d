name: Build and release 2.5D Android APK + Windows EXE

on:
  push:
    branches: [main]
    # Workflow-only maintenance must not rebuild the APK or EXE.
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded builds together: never publish half of a platform pair.
concurrency:
  group: leighneron-combined-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public fingerprint of the existing update-compatible secret-backed key.
      EXPECTED_ANDROID_CERT_SHA256: '8d4fa69a8a10b95605d173694278d84f97b6cf98a456564417ec61b552f5b2c7'
    steps:
      - name: Checkout separate 2.5D repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Reuse the official Gradle distribution on subsequent releases. A
      # transient upstream GitHub 504 must not block APK/EXE publication.
      - name: Restore Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-8.11.1-bin-v1
      - name: Prepare Gradle 8.11.1 with download retries
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Preparing Gradle 8.11.1 (attempt ${attempt}/5)"
            if bash gradlew --version; then
              exit 0
            fi
            if [[ "${attempt}" -eq 5 ]]; then
              echo "::error::Could not download the Gradle 8.11.1 distribution after five attempts."
              exit 1
            fi
            echo "::warning::Gradle download failed; retrying after a short backoff."
            sleep $((attempt * 12))
          done
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0'
      - run: npm ci
      - name: Check TypeScript without starting the game
        run: |
          npm run test:types
          npm exec --no -- tsc -p tsconfig.node.json --noEmit
      - name: Build web content and sync separate Android app
        run: |
          npm run build
          node scripts/prepare-android-downloads.mjs
          npx cap sync android
      - name: Share the existing pinned Android asset manifest with Windows
        uses: actions/upload-artifact@v4
        with:
          name: Android-Pinned-Asset-Manifest
          path: dist/native-assets.json
          if-no-files-found: error
      - name: Upload immutable game download packs
        uses: actions/upload-artifact@v4
        with:
          name: Android-Game-Download-Packs
          path: asset-packs/*.zip
          compression-level: 0
          if-no-files-found: error
      - name: Configure Android release APK signing
        env:
          ANDROID_25D_KEYSTORE_BASE64: ${{ secrets.ANDROID_25D_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_25D_STORE_PASSWORD: ${{ secrets.ANDROID_25D_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_25D_KEY_PASSWORD: ${{ secrets.ANDROID_25D_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_25D_KEY_ALIAS: ${{ secrets.ANDROID_25D_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.android"
          # A named repository secret is stable across runs. Never generate
          # an ephemeral keystore that changes the install/update signature.
          if [[ -n "${ANDROID_25D_KEYSTORE_BASE64:-}" ]]; then
            signing_bytes="$ANDROID_25D_KEYSTORE_BASE64"
            for name in ANDROID_25D_STORE_PASSWORD ANDROID_25D_KEY_PASSWORD ANDROID_25D_KEY_ALIAS; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Missing $name for the permanent release keystore."
                exit 1
              fi
            done
            echo "SIGNING_MODE=persistent-release-key" >> "$GITHUB_ENV"
          elif [[ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            # User-provided persistent debug keystore signs a non-debuggable
            # RELEASE artifact. These Android SDK defaults only apply to this
            # explicit debug-keystore secret and are overridable by secrets.
            signing_bytes="$ANDROID_DEBUG_KEYSTORE_BASE64"
            ANDROID_25D_STORE_PASSWORD="${ANDROID_25D_STORE_PASSWORD:-android}"
            ANDROID_25D_KEY_PASSWORD="${ANDROID_25D_KEY_PASSWORD:-android}"
            ANDROID_25D_KEY_ALIAS="${ANDROID_25D_KEY_ALIAS:-androiddebugkey}"
            echo "SIGNING_MODE=persistent-debug-key" >> "$GITHUB_ENV"
            echo "::warning::Using ANDROID_DEBUG_KEYSTORE_BASE64 for an assembleRelease APK. The APK is non-debuggable, but debug certificates are not suitable for Play Store production."
          else
            echo "::error::Missing signing keystore: provide ANDROID_25D_KEYSTORE_BASE64, ANDROID_KEYSTORE_BASE64, or ANDROID_DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$signing_bytes" | base64 --decode > "$HOME/.android/leighneron25d.keystore"
          keytool -list -keystore "$HOME/.android/leighneron25d.keystore" \
            -alias "$ANDROID_25D_KEY_ALIAS" -storepass "$ANDROID_25D_STORE_PASSWORD" >/dev/null
          chmod 600 "$HOME/.android/leighneron25d.keystore"
          echo "ANDROID_25D_KEYSTORE=$HOME/.android/leighneron25d.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$ANDROID_25D_STORE_PASSWORD"
          echo "::add-mask::$ANDROID_25D_KEY_PASSWORD"
          echo "ANDROID_25D_STORE_PASSWORD=$ANDROID_25D_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_25D_KEY_PASSWORD=$ANDROID_25D_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_25D_KEY_ALIAS=$ANDROID_25D_KEY_ALIAS" >> "$GITHUB_ENV"
          cat > android/app/ci-signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_25D_KEYSTORE'))
                      storePassword System.getenv('ANDROID_25D_STORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_25D_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_25D_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      debuggable false
                  }
              }
          }
          GRADLE
          printf '\napply from: "ci-signing.gradle"\n' >> android/app/build.gradle
      - name: Assemble non-debuggable 2.5D release APK
        working-directory: android
        run: bash gradlew :app:assembleRelease -PciVersionCode="$GITHUB_RUN_NUMBER" --no-daemon --console=plain
      - name: Verify signed APK and prepare release notes
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          [[ -s "$apk" ]] || { echo "::error::Missing release APK"; exit 1; }
          certificate_report="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$certificate_report"
          certificate_sha="$(printf '%s\n' "$certificate_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          if [[ -z "$certificate_sha" ]]; then
            echo "::error::APK signature certificate SHA-256 could not be verified."
            exit 1
          fi
          if [[ "${certificate_sha,,}" != "$EXPECTED_ANDROID_CERT_SHA256" ]]; then
            echo "::error::Signing identity changed. Preserve the existing ANDROID_DEBUG_KEYSTORE_BASE64 secret so installed games can update in place."
            exit 1
          fi
          metadata="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")"
          grep -q "^package: name='com.mernondna.rpg25d'" <<< "$metadata" || { echo "::error::Wrong Android package"; exit 1; }
          if grep -q '^application-debuggable' <<< "$metadata"; then echo "::error::APK still debuggable"; exit 1; fi
          cp "$apk" Tales-of-Leighneron-2.5D.apk
          sha256sum Tales-of-Leighneron-2.5D.apk > Tales-of-Leighneron-2.5D.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Tales-of-Leighneron-2.5D-Android-Release
          path: |
            Tales-of-Leighneron-2.5D.apk
            Tales-of-Leighneron-2.5D.apk.sha256
          if-no-files-found: error
          retention-days: 14

  portable-exe:
    needs: android
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      # Keep the two downloaded, version-pinned desktop tool archives in
      # predictable locations that can be restored across release builds.
      ELECTRON_CACHE: ${{ github.workspace }}/.ci-cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.ci-cache/electron-builder
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore Electron and desktop packaging archives
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/electron
            .ci-cache/electron-builder
          key: ${{ runner.os }}-electron-45.0.0-builder-26.18.0-archives-v1
      - name: Install existing game dependencies
        run: npm ci
      - name: Check TypeScript without starting the game
        run: |
          npm run test:types
          npm exec --no -- tsc -p tsconfig.node.json --noEmit
      - name: Bundle game code from the same commit as Android
        run: npm run build
      - name: Download the exact manifest produced for the APK
        uses: actions/download-artifact@v4
        with:
          name: Android-Pinned-Asset-Manifest
          path: android-download-manifest
      - name: Prepare small Windows shell using Android's existing packs
        run: node scripts/prepare-windows-downloads.mjs android-download-manifest/native-assets.json
      - name: Install pinned Windows desktop packaging tools
        run: npm install --no-save --package-lock=false electron@45.0.0 electron-builder@26.18.0
      - name: Package Windows installer and optional portable executable
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          # Electron Builder downloads third-party NSIS/signing helper archives
          # during packaging. A transient upstream HTTP 504 must not cancel the
          # matching Android APK + Windows EXE release.
          $PSNativeCommandUseErrorActionPreference = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "Windows packaging attempt $attempt of 5"
            & npx --no-install electron-builder --win nsis portable --x64 --publish never
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Windows installer and portable executable built successfully."
              exit 0
            }
            if ($attempt -eq 5) {
              throw "Electron Builder failed after five attempts (last exit code: $LASTEXITCODE)."
            }
            Write-Warning "Electron Builder failed; retrying after a short backoff. Cached downloads are kept."
            Start-Sleep -Seconds (15 * $attempt)
          }
      - name: Verify executable and record SHA256
        shell: pwsh
        run: |
          foreach ($name in @('Tales-of-Leighneron-2.5D-Setup.exe', 'Tales-of-Leighneron-2.5D-Windows.exe')) {
            $exe = Join-Path $PWD "windows-release/$name"
            if (-not (Test-Path $exe)) { throw "Windows executable was not created: $name" }
            $file = Get-Item $exe
            if ($file.Length -lt 10000000 -or $file.Length -gt 251658240) { throw "Unexpected launcher size: $name ($($file.Length) bytes)" }
            $stream = [System.IO.File]::OpenRead($exe)
            try {
              if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Invalid Windows executable header: $name" }
            } finally { $stream.Dispose() }
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content "$exe.sha256" -Encoding ascii
            Write-Host "$name`: $($file.Length) bytes, SHA256 $hash"
          }
      - name: Upload verified Windows EXE and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Tales-of-Leighneron-2.5D-Windows-Release
          path: |
            windows-release/Tales-of-Leighneron-2.5D-Setup.exe
            windows-release/Tales-of-Leighneron-2.5D-Setup.exe.sha256
            windows-release/Tales-of-Leighneron-2.5D-Windows.exe
            windows-release/Tales-of-Leighneron-2.5D-Windows.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish one Android + Windows release
    needs: [android, portable-exe]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download both verified platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Tales-of-Leighneron-2.5D-*-Release
          path: release-assets
          merge-multiple: true
      - name: Download game asset packs
        uses: actions/download-artifact@v4
        with:
          name: Android-Game-Download-Packs
          path: asset-packs
      - name: Publish immutable asset storage before the small APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=leighneron-assets-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title 'Persistent game asset storage' --notes 'Immutable data packs for the Android downloader. Keep this release.' --prerelease --latest=false
          fi
          release_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.id')"
          gh api --paginate "repos/$GH_REPO/releases/$release_id/assets?per_page=100" --jq '.[] | select(.state == "uploaded") | .name' > existing-packs.txt
          for pack in asset-packs/*.zip; do
            filename="$(basename "$pack")"
            if ! grep -Fxq "$filename" existing-packs.txt; then gh release upload "$tag" "$pack" --clobber; fi
          done
      - name: Verify Android and Windows release payloads
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          test -s Tales-of-Leighneron-2.5D.apk
          test -s Tales-of-Leighneron-2.5D.apk.sha256
          test -s Tales-of-Leighneron-2.5D-Setup.exe
          test -s Tales-of-Leighneron-2.5D-Setup.exe.sha256
          test -s Tales-of-Leighneron-2.5D-Windows.exe
          test -s Tales-of-Leighneron-2.5D-Windows.exe.sha256
          sha256sum --check Tales-of-Leighneron-2.5D.apk.sha256
          sha256sum --check Tales-of-Leighneron-2.5D-Setup.exe.sha256
          sha256sum --check Tales-of-Leighneron-2.5D-Windows.exe.sha256
      - name: Publish both files in the SAME GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="leighneron-25d-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<'NOTES'
          # Tales of Leighneron 2.5D — Android and Windows

          Android and Windows download the same immutable game-file packs on first launch, then work offline. Completed files are reused across updates; only packs containing missing or changed files are downloaded. Both use the exact manifest built by the Android job. Both downloads are built from the same source commit and published
          together. The Android APK is the non-debuggable, signature-verified
          application com.mernondna.rpg25d; it retains the existing keystore
          fingerprint for installation updates. For Windows x64, use the Setup.exe
          to install the small launcher. Windows.exe is the optional portable launcher.
          Both retain the existing desktop save origin and persistent local storage.
          First-launch game-file downloads require an internet connection and disk space;
          restarting or retrying keeps verified completed files.

          Traveling horse caravans have been removed from both platforms.
          Boats, quests, combat, saves and the 2.5D world remain available.

          Windows EXE is not Authenticode-signed. SmartScreen may display an
          unknown-publisher warning. Real-device gameplay and FPS are not
          established by CI compilation and packaging alone. Back up saves
          before installation changes.
          NOTES
          gh release create "$tag" \
            release-assets/Tales-of-Leighneron-2.5D.apk \
            release-assets/Tales-of-Leighneron-2.5D.apk.sha256 \
            release-assets/Tales-of-Leighneron-2.5D-Setup.exe \
            release-assets/Tales-of-Leighneron-2.5D-Setup.exe.sha256 \
            release-assets/Tales-of-Leighneron-2.5D-Windows.exe \
            release-assets/Tales-of-Leighneron-2.5D-Windows.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "Tales of Leighneron 2.5D - Android + Windows ($tag)" \
            --notes-file release-notes.md \
            --latest
          {
            echo "### Both platforms are in one release"
            echo "- Android APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Tales-of-Leighneron-2.5D.apk"
            echo "- Windows installer: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Tales-of-Leighneron-2.5D-Setup.exe"
            echo "- Windows portable EXE: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Tales-of-Leighneron-2.5D-Windows.exe"
            echo "- Combined release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only the four newest published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # List ALL published releases, including older platform-specific ones.
          # Sort by actual publish time: API order is not always chronological.
          rows="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .tag_name != "leighneron-assets-v1") | [(.published_at // .created_at), .tag_name] | @tsv')"
          if [[ -z "$rows" ]]; then
            echo 'No published releases to prune.'
            exit 0
          fi
          mapfile -t tags < <(printf '%s\n' "$rows" | LC_ALL=C sort -r | cut -f2)
          echo "Published releases before cleanup: ${#tags[@]}"
          for ((index=4; index<${#tags[@]}; index++)); do
            tag="${tags[index]}"
            if [[ -z "$tag" ]]; then echo 'Empty tag, refusing cleanup'; exit 1; fi
            echo "Removing old release and tag: $tag"
            gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes
          done
          echo 'Finished: keep only the four most recently published releases.'
