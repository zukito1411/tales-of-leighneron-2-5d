appId: com.mernondna.rpg25d.desktop
productName: Tales of Leighneron 2.5D
directories:
  output: windows-release
  app: desktop-package
files:
  - dist/**/*
  - desktop/**/*
  - package.json
extraMetadata:
  main: desktop/main.cjs
asar: true
asarUnpack:
  - desktop/asset-worker.cjs
  - desktop/asset-store.cjs
  - desktop/vendor/**/*
  - dist/native-assets.json
compression: normal
electronVersion: 45.0.0
win:
  icon: public/icons/tales-of-leighneron-512.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Tales-of-Leighneron-2.5D-Setup.exe
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
portable:
  artifactName: Tales-of-Leighneron-2.5D-Windows.exe
publish: null
